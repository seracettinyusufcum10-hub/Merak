name: MERAK APK Derleme

on:
  push:
    paths:
      - 'MERAK-KURULUM-KAYNAK.zip'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Projeyi al
        uses: actions/checkout@v4
      - name: Java 17 hazirla
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35 yukle
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9 hazirla
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Kaynak paketini ac
        run: |
          test -f MERAK-KURULUM-KAYNAK.zip || { echo 'Kaynak ZIP dosyasi bulunamadi'; exit 1; }
          unzip -q MERAK-KURULUM-KAYNAK.zip -d source
          test -f source/MERAK-Android/settings.gradle.kts
      - name: MERAK kapak ve simgeyi duzelt
        run: |
          python3 -m venv /tmp/merak-venv
          /tmp/merak-venv/bin/python -m pip install --quiet Pillow
          /tmp/merak-venv/bin/python scripts/fix_cover.py source/MERAK-Android
      - name: Gunluk ruh hali ve arayuz duzeltmeleri
        run: python3 scripts/fix_mood_ui.py source/MERAK-Android
      - name: Kotlin donus degerini duzelt
        run: |
          sed -i 's/^            (0 until pages.length()).mapNotNull/            return (0 until pages.length()).mapNotNull/' source/MERAK-Android/app/src/main/java/com/merak/app/MerakData.kt
      - name: Debug APK olustur
        run: gradle --no-daemon --stacktrace -p source/MERAK-Android :app:assembleDebug
      - name: APK indirilebilir dosya olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: MERAK-APK
          path: source/MERAK-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
