name: MERAK APK Derleme

on:
  push:
    paths:
      - 'MERAK-KURULUM-KAYNAK.zip'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Projeyi al
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Java 17 hazirla
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35 yukle
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9 hazirla
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.9'
      - name: Kaynak paketini ac
        run: |
          test -f MERAK-KURULUM-KAYNAK.zip || { echo 'Kaynak ZIP dosyasi bulunamadi'; exit 1; }
          echo '4dfbfd6145670094aa5bd992cbc2f38fe2237e49db743852e8670560b287754c  MERAK-KURULUM-KAYNAK.zip' | sha256sum -c -
          unzip -q MERAK-KURULUM-KAYNAK.zip -d source
          test -f source/MERAK-Android/settings.gradle.kts
      - name: MERAK kapak ve simgeyi duzelt
        run: |
          python3 -m venv /tmp/merak-venv
          /tmp/merak-venv/bin/python -m pip install --quiet --only-binary=:all: Pillow==11.3.0
          /tmp/merak-venv/bin/python scripts/fix_cover.py source/MERAK-Android
      - name: Gunluk ruh hali ve arayuz duzeltmeleri
        run: python3 scripts/fix_mood_ui.py source/MERAK-Android
      - name: Ilgi alanlari ve gunluk kesifler
        run: python3 scripts/personalize_daily.py source/MERAK-Android
      - name: Ag ve gizlilik guvenlik sertlestirmesi
        run: python3 scripts/security_harden.py source/MERAK-Android
      - name: Yerel yedekleme kaynagini ekle
        run: cp app-patches/MerakBackup.kt source/MERAK-Android/app/src/main/java/com/merak/app/MerakBackup.kt
      - name: Yedek arayuzunu ve gizlilik mesajlarini duzenle
        run: python3 scripts/backup_ui.py source/MERAK-Android
      - name: Icerik ve veri guvenligi kalite testi
        run: python3 scripts/quality_check.py source/MERAK-Android
      - name: Kotlin donus degerini duzelt
        run: |
          sed -i 's/^            (0 until pages.length()).mapNotNull/            return (0 until pages.length()).mapNotNull/' source/MERAK-Android/app/src/main/java/com/merak/app/MerakData.kt
      - name: Debug APK olustur
        run: gradle --no-daemon --stacktrace -p source/MERAK-Android :app:assembleDebug
      - name: APK imzasi ve izinlerini denetle
        run: |
          APK="source/MERAK-Android/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" > apk-permissions.txt
          python3 scripts/security_verify.py source/MERAK-Android apk-permissions.txt
          (cd source/MERAK-Android/app/build/outputs/apk/debug && sha256sum app-debug.apk > SHA256SUMS.txt)
      - name: APK indirilebilir dosya olarak sakla
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MERAK-APK
          path: |
            source/MERAK-Android/app/build/outputs/apk/debug/app-debug.apk
            source/MERAK-Android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
